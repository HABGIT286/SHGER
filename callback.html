<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion - Callback</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            border: 4px solid rgba(88, 101, 242, 0.3);
            border-top: 4px solid #5865F2;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #5865F2;
            margin-bottom: 10px;
        }
        p {
            color: #72767d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>جاري معالجة تسجيل الدخول...</h2>
        <p>سيتم تحويلك تلقائياً</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        
        if (code && state) {
            // حفظ الكود في localStorage
            localStorage.setItem('oauth_code', code);
            localStorage.setItem('oauth_state', state);
            
            // العودة للصفحة الرئيسية
            window.location.href = window.location.origin + window.location.pathname.replace('callback.html', '') + 'index.html';
        } else {
            document.querySelector('h2').textContent = 'خطأ في المصادقة';
            document.querySelector('p').textContent = 'لم يتم استلام رمز المصادقة';
        }
    </script>
</body>
</html>
