<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion - جاري المعالجة...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(30, 30, 46, 0.8);
            border-radius: 16px;
            border: 1px solid rgba(88, 101, 242, 0.3);
            max-width: 600px;
        }
        .spinner {
            border: 4px solid rgba(88, 101, 242, 0.3);
            border-top: 4px solid #5865F2;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { color: #5865F2; margin-bottom: 15px; }
        .success { color: #3BA55C; }
        .error { color: #f04747; }
        .debug {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            font-family: monospace;
            font-size: 0.8em;
            max-height: 300px;
            overflow-y: auto;
            word-break: break-all;
            display: none;
        }
        .back-btn {
            background: linear-gradient(135deg, #5865F2, #7289DA);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(88, 101, 242, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h2 id="title">جاري معالجة تسجيل الدخول...</h2>
        <p id="message">سيتم تحويلك للصفحة الرئيسية خلال لحظات</p>
        <div class="debug" id="debugInfo"></div>
        <a href="index.html" class="back-btn" id="backBtn" style="display:none;">العودة للرئيسية</a>
    </div>

    <script>
        const debugInfo = document.getElementById('debugInfo');
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const spinner = document.getElementById('spinner');
        const backBtn = document.getElementById('backBtn');
        
        let debugText = '=== تفاصيل المصادقة ===\n\n';
        
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        const errorDesc = urlParams.get('error_description');
        
        debugText += 'URL الكامل: ' + window.location.href + '\n\n';
        debugText += 'Search Params: ' + window.location.search + '\n';
        debugText += 'Hash: ' + window.location.hash + '\n\n';
        
        if (code) {
            debugText += '✅ Authorization Code: موجود\n';
            debugText += 'Code: ' + code.substring(0, 40) + '...\n';
            debugText += 'State: ' + state + '\n';
            debugText += '\n✅ تم استلام الكود بنجاح\n';
            debugText += 'جاري التحويل للصفحة الرئيسية...\n';
            
            title.textContent = '✅ تم استلام الكود بنجاح';
            title.className = 'success';
            message.textContent = 'جاري معالجة البيانات...';
            spinner.style.display = 'none';
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
            
        } else if (error) {
            debugText += '❌ Error: ' + error + '\n';
            debugText += 'Description: ' + errorDesc + '\n';
            
            title.textContent = '❌ خطأ في المصادقة';
            title.className = 'error';
            message.textContent = errorDesc || 'حدث خطأ غير معروف';
            spinner.style.display = 'none';
            backBtn.style.display = 'inline-block';
            
        } else {
            debugText += '❌ لم يتم استلام أي بيانات\n';
            debugText += 'جميع المعاملات: ' + JSON.stringify(Object.fromEntries(urlParams)) + '\n';
            
            title.textContent = '❌ لم يتم استلام البيانات';
            title.className = 'error';
            message.textContent = 'تحقق من إعدادات OAuth2 في Discord';
            spinner.style.display = 'none';
            backBtn.style.display = 'inline-block';
        }
        
        debugInfo.textContent = debugText;
        debugInfo.style.display = 'block';
        console.log('[Orion Callback]', debugText);
    </script>
</body>
</html>
