<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion - جاري المعالجة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            border: 4px solid rgba(88, 101, 242, 0.3);
            border-top: 4px solid #5865F2;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #5865F2;
            margin-bottom: 10px;
        }
        p {
            color: #72767d;
            margin-bottom: 20px;
        }
        .back-btn {
            background: linear-gradient(135deg, #5865F2, #7289DA);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(88, 101, 242, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>جاري معالجة تسجيل الدخول...</h2>
        <p>سيتم تحويلك تلقائياً خلال ثوانٍ</p>
        <a href="index.html" class="back-btn">العودة للصفحة الرئيسية</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        
        if (error) {
            document.querySelector('h2').textContent = 'خطأ في المصادقة';
            document.querySelector('p').textContent = `التفاصيل: ${error}`;
            document.querySelector('.spinner').style.display = 'none';
        } else if (code && state) {
            // حفظ الكود في localStorage
            localStorage.setItem('oauth_code', code);
            localStorage.setItem('oauth_state', state);
            
            // العودة للصفحة الرئيسية
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        } else {
            document.querySelector('h2').textContent = 'لا توجد بيانات مصادقة';
            document.querySelector('p').textContent = 'لم يتم استلام رمز المصادقة';
            document.querySelector('.spinner').style.display = 'none';
        }
    </script>
</body>
</html>
