
name: Islamic Exam - Start Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: islamic-exam-server
  cancel-in-progress: false

jobs:
  run-website:
    name: Start Islamic Exam Website
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PORT: 8080
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check project files and secrets
        shell: bash
        run: |
          set -e

          test -f index.html || {
            echo "ERROR: index.html is missing"
            exit 1
          }

          test -f server.py || {
            echo "ERROR: server.py is missing"
            exit 1
          }

          test -f requirements.txt || {
            echo "ERROR: requirements.txt is missing"
            exit 1
          }

          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "ERROR: ADMIN_PASSWORD secret is missing"
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Telegram bot token is not configured."
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram chat ID is not configured."
          fi

          echo "Project files and required secret verified."

      - name: Start Python server
        shell: bash
        run: |
          set -e

          mkdir -p runtime

          nohup python -u server.py > runtime/server.log 2>&1 &
          echo $! > runtime/server.pid

          echo "Waiting for Flask server..."

          SERVER_READY=0

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health -o runtime/health.json; then
              SERVER_READY=1
              break
            fi
            sleep 2
          done

          if [ "$SERVER_READY" -ne 1 ]; then
            echo "ERROR: Python server failed to start."
            cat runtime/server.log
            exit 1
          fi

          echo "Health response:"
          cat runtime/health.json

          echo ""
          echo "Testing website homepage..."

          curl -fsS http://127.0.0.1:8080/ -o runtime/homepage.html

          if [ ! -s runtime/homepage.html ]; then
            echo "ERROR: Homepage is empty."
            exit 1
          fi

          echo "Homepage is responding successfully."

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -e

          curl --fail --location --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output cloudflared

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

          cloudflared --version

      - name: Open public website
        shell: bash
        run: |
          set -e

          mkdir -p runtime

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8080 \
            --no-autoupdate \
            > runtime/tunnel.log 2>&1 &

          echo $! > runtime/tunnel.pid

          echo "Waiting for Cloudflare public URL..."

          URL=""

          for i in $(seq 1 90); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' runtime/tunnel.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "ERROR: Cloudflare URL was not generated."
            cat runtime/tunnel.log
            exit 1
          fi

          echo "$URL" > runtime/public-url.txt

          echo ""
          echo "=========================================="
          echo "ISLAMIC EXAM WEBSITE"
          echo "$URL"
          echo "=========================================="

          echo "## Islamic Exam Website" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Public website URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Health check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL/health" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Keep this workflow running while the exam is active." >> "$GITHUB_STEP_SUMMARY"

          echo "Public URL created successfully."

      - name: Verify public website
        shell: bash
        run: |
          set -e

          URL=$(cat runtime/public-url.txt)

          echo "Checking public website..."

          SUCCESS=0

          for i in $(seq 1 20); do
            if curl --fail --silent --show-error "$URL/health" -o runtime/public-health.json; then
              SUCCESS=1
              break
            fi
            sleep 3
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "ERROR: Public website health check failed."
            cat runtime/tunnel.log
            exit 1
          fi

          echo "Public health response:"
          cat runtime/public-health.json

          echo ""
          echo "Public website is accessible."

      - name: Keep website running
        shell: bash
        run: |
          echo "Website is running."

          while true; do

            if ! kill -0 "$(cat runtime/server.pid)" 2>/dev/null; then
              echo "ERROR: Python server stopped."
              cat runtime/server.log
              exit 1
            fi

            if ! kill -0 "$(cat runtime/tunnel.pid)" 2>/dev/null; then
              echo "ERROR: Cloudflare tunnel stopped."
              cat runtime/tunnel.log
              exit 1
            fi

            sleep 30
          done

      - name: Show logs if failed
        if: failure()
        shell: bash
        run: |
          echo "========== PYTHON SERVER LOG =========="
          cat runtime/server.log || true

          echo "========== CLOUDFLARE TUNNEL LOG =========="
          cat runtime/tunnel.log || true

          echo "========== HEALTH CHECK =========="
          cat runtime/health.json || true
          cat runtime/public-health.json || true
