name: SOKO TK Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot==22.5 aiohttp

      - name: Run SOKO TK
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          JPG: ${{ secrets.JPG }}
        run: |
          python bot.py
