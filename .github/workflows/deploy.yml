name: Deploy Tusha Chat

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Secrets into HTML
        run: |
          sed -i "s|__BOT_TOKEN__|${{ secrets.TELEGRAM_BOT_TOKEN }}|g" index.html
          sed -i "s|__API_ID__|${{ secrets.TELEGRAM_API_ID }}|g" index.html
          sed -i "s|__API_HASH__|${{ secrets.TELEGRAM_API_HASH }}|g" index.html
          sed -i "s|__WEBHOOK__|${{ secrets.DISCORD_WEBHOOK_URL }}|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
